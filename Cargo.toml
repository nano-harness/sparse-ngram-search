[workspace]
members = [
    "crates/core",
    "crates/git",
    "crates/cli",
    "crates/freq-gen",
    "crates/bench",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = []

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Regex
regex = "1"
regex-syntax = "0.8"

# Storage / IO
memmap2 = "0.9"
byteorder = "1"
fs2 = "0.4"

# Git
git2 = { version = "0.19", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"

# Parallelism
rayon = "1"

# File walking / ignore
ignore = "0.4"

# Platform directories
dirs = "5"

# Hashing
fnv = "1"
memchr = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
